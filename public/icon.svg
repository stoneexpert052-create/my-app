
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Top Face Highlight Gradient: Realistic White Marble / Plaster -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FBFBFB" />
      <stop offset="70%" stop-color="#EFF2F5" />
      <stop offset="100%" stop-color="#D9DFE5" />
    </linearGradient>

    <!-- Side Bevel Gradient -->
    <linearGradient id="sideBevel" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Deep Bevel Underside / Occlusion Gradient -->
    <linearGradient id="deepBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Soft Ambient Cast Shadow -->
    <filter id="castShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#090D16" flood-opacity="0.32" />
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  

  <!-- Main Logo Emblem -->
  <g filter="url(#castShadow)" transform="translate(300, 290) scale(0.96) translate(-300, -290)">
    
    <!-- 1. 3D DEEP EXTRUSION LAYER (Base depth) -->
    <g transform="translate(6, 12)" fill="url(#deepBevel)" stroke="url(#deepBevel)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <!-- Ring Extrusion -->
      <path d="
        M 180 488
        A 242 242 0 1 1 420 488
        L 458 518
        A 282 282 0 1 0 142 518
        Z" />
      
      <!-- Mountain Facets Extrusion -->
      <!-- Left solid triangular facet -->
      <polygon points="144,324 204,188 248,348 162,338" />
      <!-- Center-left angled facet -->
      <polygon points="204,188 290,92 260,352 248,348" />
      <!-- Main tall center peak -->
      <polygon points="290,92 364,258 324,352 260,352" />
      
      <!-- Right wireframe frame structures -->
      <polygon points="290,92 414,196 364,258" />
      <polygon points="414,196 488,326 424,352 364,258" />

      <!-- Horizontal Ledge Bar -->
      <rect x="150" y="474" width="300" height="16" rx="4" />

      <!-- 3D Typography Extrusion -->
      <g font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
        <text x="300" y="405" font-size="64" letter-spacing="5">STONE</text>
        <text x="300" y="465" font-size="58" letter-spacing="4.5">EXPERT</text>
      </g>
    </g>

    <!-- 2. MID-TONE 3D BEVEL EDGES -->
    <g transform="translate(2.5, 5)" fill="url(#sideBevel)" stroke="url(#sideBevel)" stroke-width="1.8" stroke-linejoin="round">
      <!-- Ring Bevel -->
      <path d="
        M 180 488
        A 242 242 0 1 1 420 488
        L 456 516
        A 282 282 0 1 0 144 516
        Z" />

      <!-- Left Solid Facet -->
      <polygon points="144,324 204,188 248,348 162,338" />
      <!-- Center-Left Facet -->
      <polygon points="204,188 290,92 260,352 248,348" />
      <!-- Center Peak -->
      <polygon points="290,92 364,258 324,352 260,352" />

      <!-- Right Wireframe Bevels -->
      <path d="
        M 290,92 L 414,196 L 364,258 Z
        M 314,136 L 388,206 L 354,244 Z" fill-rule="evenodd" />

      <path d="
        M 414,196 L 488,326 L 424,352 L 364,258 Z
        M 422,230 L 464,316 L 424,334 L 382,274 Z" fill-rule="evenodd" />

      <!-- Horizontal Bar -->
      <rect x="150" y="473" width="300" height="15" rx="4" />

      <!-- Text -->
      <g font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
        <text x="300" y="403" font-size="64" letter-spacing="5">STONE</text>
        <text x="300" y="463" font-size="58" letter-spacing="4.5">EXPERT</text>
      </g>
    </g>

    <!-- 3. TOP WHITE MARBLE PRISTINE FRONT FACE -->
    <g fill="url(#topFace)" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round">
      <!-- Outer Ring (Broken at bottom, ends flared downward slightly) -->
      <path d="
        M 182 486
        A 242 242 0 1 1 418 486
        L 454 514
        A 282 282 0 1 0 146 514
        Z" />

      <!-- Mountain Peak: Left Facet -->
      <polygon points="144,324 204,188 248,348 162,338" />

      <!-- Mountain Peak: Middle Left Facet -->
      <polygon points="204,188 290,92 260,352 248,348" />

      <!-- Mountain Peak: Center Peak Surface -->
      <polygon points="290,92 364,258 324,352 260,352" />

      <!-- Mountain Peak: Wireframe Right Frames -->
      <path d="
        M 290,92 L 414,196 L 364,258 Z
        M 314,136 L 388,206 L 354,244 Z" fill-rule="evenodd" />

      <path d="
        M 414,196 L 488,326 L 424,352 L 364,258 Z
        M 422,230 L 464,316 L 424,334 L 382,274 Z" fill-rule="evenodd" />

      <!-- Horizontal Ledge Bar under EXPERT -->
      <rect x="150" y="471" width="300" height="13" rx="3.5" />

      <!-- 3D Front Face Typography -->
      <g font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
        <text x="300" y="401" font-size="64" letter-spacing="5">STONE</text>
        <text x="300" y="461" font-size="58" letter-spacing="4.5">EXPERT</text>
      </g>
    </g>

    <!-- 4. INNER HIGHLIGHT RIDGES -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" stroke-linecap="round">
      <path d="M 200 135 A 242 242 0 0 1 400 135" />
      <line x1="290" y1="92" x2="324" y2="352" />
      <line x1="204" y1="188" x2="260" y2="352" />
      <line x1="152" y1="472" x2="448" y2="472" />
    </g>

  </g>
</svg>
